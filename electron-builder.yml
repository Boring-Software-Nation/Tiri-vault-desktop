# Installer settings (the only builder config; package.json has no "build" block).
# appId identifies the app to Windows/macOS for updates and uninstall: don't change it after the first release.
appId: com.tirivault.desktop
productName: Tiri Vault
directories:
  buildResources: build
  output: release/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!release/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,BUILD.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asar: true
asarUnpack:
  - resources/**
npmRebuild: false

win:
  executableName: TiriVault
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: TiriVault-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  include: build/installer.nsh

mac:
  icon: build/icon.png
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  target: [dmg]
dmg:
  artifactName: TiriVault-${version}.${ext}

linux:
  target: [AppImage]
  maintainer: Boring Software Nation
  category: Utility
appImage:
  artifactName: TiriVault-${version}.${ext}

# No auto-update server yet. Installers are attached to GitHub Releases by CI (see BUILD.md).
publish: null
